<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d3c3"/>
      <stop offset="0.55" stop-color="#cf7f68"/>
      <stop offset="1" stop-color="#7a4a41"/>
    </linearGradient>
    <radialGradient id="b0"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#f3d3c3" stop-opacity=".9"/><stop offset="1" stop-color="#f3d3c3" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#7a4a41" stop-opacity=".8"/><stop offset="1" stop-color="#7a4a41" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <g filter="url(#blur)">
    <circle cx="60" cy="50" r="60" fill="url(#b0)" opacity="0.18"/>
    <circle cx="257" cy="363" r="131" fill="url(#b1)" opacity="0.25"/>
    <circle cx="454" cy="676" r="72" fill="url(#b2)" opacity="0.32"/>
    <circle cx="651" cy="189" r="143" fill="url(#b0)" opacity="0.39"/>
    <circle cx="848" cy="502" r="84" fill="url(#b1)" opacity="0.18"/>
  </g>
  <rect width="1200" height="900" filter="url(#grain)" opacity="0.6"/>
  <rect width="1200" height="900" fill="url(#vignette)" opacity="0.35"/>
  <defs>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.76">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
  </defs>
</svg>
